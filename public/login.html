<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Royals Gym · Admin Login</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <main class="login-card">
    <img src="/logo.svg" alt="Royals Gym logo" class="login-logo" width="72" height="72">
    <h1>Royals Gym</h1>
    <p class="muted">Admin sign in</p>

    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>

      <label for="password">Password</label>
      <div class="password-wrap">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" id="toggle-pw" class="link-btn" aria-label="Show password">Show</button>
      </div>

      <p id="login-error" class="form-error" role="alert" hidden></p>

      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign in</button>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
